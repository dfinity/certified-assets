<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catch-all 404 demo</title>
  </head>
  <body>
    <main>
      <h1>Catch-all 404 demo</h1>
      <p>This site combines auto-synthesised clean URLs with a single
        <code>/* /404.html 404</code> catch-all in <code>_redirects</code>.</p>
      <ul>
        <li><a href="/foo">/foo</a> and <a href="/blog/">/blog/</a> resolve to real assets.</li>
        <li>Anything else — e.g. <a href="/nope">/nope</a> — serves the custom 404 page.</li>
      </ul>
    </main>
  </body>
</html>
