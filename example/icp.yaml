canisters:
  - name: frontend
    build:
      steps:
        - type: script
          commands:
            - cargo build -p canister --target wasm32-unknown-unknown --release
            - cp ../target/wasm32-unknown-unknown/release/canister.wasm "$ICP_WASM_OUTPUT_PATH"
      
        - type: script
          commands:
            - command -v ic-wasm >/dev/null 2>&1 || { echo >&2 "ic-wasm not found. To install ic-wasm, see https://github.com/dfinity/ic-wasm\n"; exit 1; }
            - ic-wasm "$ICP_WASM_OUTPUT_PATH" -o "$ICP_WASM_OUTPUT_PATH" metadata candid:service -f ../ic-certified-assets/assets.did --keep-name-section

    sync:
      steps:
        - type: script
          commands:
            - cargo build -p plugin --target wasm32-wasip2 --release  
        - type: plugin
          path: ../target/wasm32-wasip2/release/plugin.wasm
          dirs:
            - dist
