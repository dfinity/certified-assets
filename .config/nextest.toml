# cargo-nextest configuration. See https://nexte.st/docs/configuration/
#
# Each e2e test starts its own local replica (`icp network start`), which is
# memory-heavy. nextest's global scheduler would otherwise run up to num-cpus of
# them at once (alongside the unit tests it interleaves), so we cap the e2e
# group to bound the number of concurrent replicas — a memory guard that also
# keeps a larger runner from spawning enough replicas to exhaust RAM. On the
# current 3–4 vCPU CI runners this is effectively a no-op (global concurrency is
# already that low); raise it if the runners grow.
[test-groups]
e2e = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'package(e2e)'
test-group = 'e2e'
