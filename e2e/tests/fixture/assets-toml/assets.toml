# Content-type overrides for files mime_guess doesn't classify usefully.
# Same shape as the developer-docs `.ic-assets.json5` rules being migrated.

[[asset]]
match = "/*.did"
content_type = "text/plain; charset=utf-8"

[[asset]]
match = "/*.sh"
content_type = "text/plain; charset=utf-8"

[[asset]]
match = "/llms.txt"
content_type = "text/plain; charset=utf-8"
