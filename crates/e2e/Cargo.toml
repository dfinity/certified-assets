[package]
name = "e2e"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
asset-prep = { path = "../asset-prep" }
recipe-gen = { path = "../recipe-gen" }
wire-types = { path = "../wire-types" }
assert_cmd.workspace = true
candid.workspace = true
hex.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
tempfile.workspace = true

# Only the #[ignore]'d native latency bench (tests/latency.rs) needs a live
# agent; keep the heavy async stack out of the default test build's link set by
# scoping it to dev-deps.
[dev-dependencies]
sync-agent = { path = "../sync-agent" }
ic-agent.workspace = true
tokio.workspace = true
# Only the SNS governance test (tests/sns.rs) needs it: it drives the PocketIC
# instance behind `icp network start` directly, which is the one way to send a
# call *as* the NNS governance canister. Version-matched to the server
# icp-cli-network-launcher runs.
pocket-ic = "16.0.0"
sha2.workspace = true
