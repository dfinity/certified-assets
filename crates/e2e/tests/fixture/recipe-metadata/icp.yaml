networks:
  - name: local
    mode: managed
    gateway:
      port: 0

canisters:
  - name: frontend
    recipe:
      type: "file://recipe.hbs"
      configuration:
        dir: dist
        metadata:
          # A public section (readable by anyone) and one left private (the
          # default when `visibility` is omitted) — the mixed shape the recipe
          # README documents.
          - name: "build:commit"
            value: "a1b2c3d"
            visibility: public
          - name: "app:framework"
            value: "react"
