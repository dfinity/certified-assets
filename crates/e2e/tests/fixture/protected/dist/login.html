<!DOCTYPE html>
<html>
  <head>
    <title>Sign in</title>
    <style>
      body {
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>
    <h1>Sign in</h1>
    <!-- Self-contained: the login page is the only gate-exempt path, so it must
         inline everything (no external CSS/JS/images). -->
    <form method="POST" action="/login.html">
      <input type="password" name="token" placeholder="Access token" />
      <button type="submit">Enter</button>
    </form>
    <script>
      // Transparent flow: a token in the URL fragment is auto-submitted.
      var t = new URLSearchParams(location.hash.slice(1)).get("t");
      if (t) {
        var f = document.forms[0];
        f.token.value = t;
        history.replaceState(null, "", location.pathname);
        f.submit();
      }
    </script>
  </body>
</html>
