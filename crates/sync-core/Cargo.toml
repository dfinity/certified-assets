[package]
name = "sync-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

# The local `dist/` preparation (scan/encode/headers/redirects/hash) lives in
# `asset-prep`, shared with the offline verifier. sync-core keeps only the
# canister-call orchestration (diff, upload, execute, auth), so its dependency
# set is small.

# Passthrough for `asset-prep`'s canonical compressor registry: on by default so
# `sync-plugin` and the tests get `Compressors::canonical()`, off for a native
# embedder that injects its own and wants neither compressor crate linked.
[features]
default = ["canonical-compressors"]
canonical-compressors = ["asset-prep/canonical-compressors"]

[dependencies]
wire-types = { path = "../wire-types" }
asset-prep = { path = "../asset-prep", default-features = false }
candid.workspace = true
hex.workspace = true
serde.workspace = true
serde_bytes.workspace = true

[dev-dependencies]
tempfile.workspace = true
sha2.workspace = true
