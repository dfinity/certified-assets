name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 4 * * 0,3" # 4 a.m. UTC every Sun and Wed, keep actions-cache available

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All jobs use `actions-rust-lang/setup-rust-toolchain@v1`, which handles both
# toolchain installation and Rust-specific caching (via Swatinem/rust-cache)
# internally.  No separate `actions/cache` step is needed.  Caches are
# automatically separated per job (the key includes the job name, OS, and a
# hash of Cargo.lock).
#
# The toolchain is pinned in rust-toolchain.toml, but the runner image also
# ships a `stable` toolchain whose version drifts as the image updates.
# rust-cache folds every installed toolchain's version into its hash, so jobs
# with caching remove the bundled `stable` first — leaving only the pinned
# version, which keeps the cache key deterministic instead of missing every run.

jobs:
  test:
    name: cargo test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-24.04, macos-15 ]
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove pre-installed Rust stable toolchain
        run: rustup toolchain remove stable 2>/dev/null || true
      # No explicit `toolchain` — uses the channel from rust-toolchain.toml,
      # including the wasm32-unknown-unknown and wasm32-wasip2 targets needed by `icp deploy`.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
      - name: Install icp CLI
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/dfinity/icp-cli/releases/latest/download/icp-cli-installer.sh | sh
      # Required by the recipe e2e test that exercises the `metadata` config
      # field, which injects wasm metadata via ic-wasm during `icp deploy`.
      # Pinned to match release.yml.
      - name: Install ic-wasm
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/dfinity/ic-wasm/releases/download/0.9.11/ic-wasm-installer.sh | sh
      # Warm the shared network-launcher cache once, up front, so the parallel
      # e2e tests reuse it instead of each racing to download the same tarball.
      # ICP_CLI_GITHUB_TOKEN authenticates this download (5000/h limit vs the
      # unauthenticated 60/h that the tests were tripping); a short retry
      # absorbs the occasional transient 5xx from GitHub. Only this step needs
      # the token — once the launcher is cached, the test step downloads nothing.
      - name: Pre-download network launcher
        run: |
          for attempt in 1 2 3; do
            if icp network update; then
              exit 0
            fi
            echo "network launcher download attempt $attempt failed; retrying..." >&2
            sleep $((attempt * 5))
          done
          echo "network launcher download failed after 3 attempts" >&2
          exit 1
        env:
          ICP_CLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run tests
        run: | # https://github.com/rust-lang/cargo/issues/6669 we have to run ALL tests with two commands
          cargo test --all-targets --no-fail-fast
          cargo test --doc

  fmt:
    name: cargo fmt
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # No explicit `toolchain` — uses the channel from rust-toolchain.toml.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          cache: false # Disable caching for fmt, since it doesn't build anything.
      - name: Check formatting
        run: |
          cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove pre-installed Rust stable toolchain
        run: rustup toolchain remove stable 2>/dev/null || true
      # No explicit `toolchain` — uses the channel from rust-toolchain.toml.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
      - name: Run clippy
        run: |
          cargo clippy --tests --benches --keep-going -- -D warnings

  benchmark:
    name: canbench
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove pre-installed Rust stable toolchain
        run: rustup toolchain remove stable 2>/dev/null || true
      # No explicit `toolchain` — uses the channel from rust-toolchain.toml,
      # including the wasm32-unknown-unknown target the benchmark wasm is built for.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
      # The in-wasm harness `canbench-rs` is pinned to 0.6.0 in Cargo.toml; the
      # CLI must match so the results-file format and the PocketIC runtime
      # version line up. Download the prebuilt static (musl) x86_64 Linux binary
      # from the GitHub release rather than `cargo install`, which would compile
      # canbench from source on every run.
      - name: Install canbench
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -fLsS \
            https://github.com/dfinity/canbench/releases/download/v0.6.0/canbench \
            -o "$HOME/.local/bin/canbench"
          chmod +x "$HOME/.local/bin/canbench"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/canbench" --version
      # canbench downloads a ~100 MB PocketIC runtime into .canbench/ on first
      # run; cache it so later runs don't re-download. Keyed on the canbench
      # version, which pins the runtime version.
      - name: Cache PocketIC runtime
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: crates/canister-core/.canbench
          key: canbench-pocketic-0.6.0-${{ runner.os }}
      # Runs the benches and compares against the committed baseline
      # (crates/canister-core/canbench_results.yml). Fails if any benchmark moved
      # beyond canbench's noise threshold, or one was added/removed — meaning the
      # committed baseline is stale and must be re-persisted. Instruction counts
      # are host-independent (a property of the wasm + PocketIC's deterministic
      # counter), so the baseline tracks across machines and CI.
      - name: Run benchmarks and check the committed baseline
        working-directory: crates/canister-core
        run: |
          set -Eeuo pipefail
          canbench --less-verbose --show-summary | tee /tmp/canbench.txt
          if grep -qE '\(regressed by|\(improved by|\(new\)|status:[[:space:]]+Regressions|status:[[:space:]]+Improvements|status:[[:space:]]+New[[:space:]]+benchmarks' /tmp/canbench.txt; then
            echo "::error::canbench_results.yml is out of date: a benchmark changed beyond the noise threshold, or was added/removed. If the change is expected, run 'canbench --persist' in crates/canister-core and commit the updated canbench_results.yml."
            exit 1
          fi

  aggregate:
    name: ci:required
    if: ${{ always() }}
    needs: [ test, fmt, clippy, benchmark ]
    runs-on: ubuntu-24.04
    steps:
      - name: check test result
        if: ${{ needs.test.result != 'success' }}
        run: exit 1
      - name: check fmt result
        if: ${{ needs.fmt.result != 'success' }}
        run: exit 1
      - name: check clippy result
        if: ${{ needs.clippy.result != 'success' }}
        run: exit 1
      - name: check benchmark result
        if: ${{ needs.benchmark.result != 'success' }}
        run: exit 1
