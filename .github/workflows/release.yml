name: Release

# Triggered by pushing a `v<semver>` tag (e.g. v0.1.0) matching the single
# workspace version in Cargo.toml. Create it with `make tag` and push it. That
# version is compiled into both modules via CARGO_PKG_VERSION and is what the
# canister's `version` query returns at runtime, so the tag maps straight to the
# released artifacts.
on:
  push:
    tags:
      - "v[0-9]*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel an in-flight publish.
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub release and upload its assets

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history + all branches so the publish step can tell whether the
          # tagged commit is on main (release provenance).
          fetch-depth: 0

      - name: Validate tag matches the workspace version
        run: |
          # Re-read the workspace version from Cargo.toml and reject a tag that
          # doesn't match, so a hand-crafted or stale tag can't ship a
          # mislabelled build. The compiled-in version (CARGO_PKG_VERSION) comes
          # from this same line, so this keeps tag, artifacts, and the `version`
          # query in lockstep.
          expected=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$GITHUB_REF_NAME" != "v$expected" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match the workspace version (expected 'v$expected'). Bump Cargo.toml and create the tag with 'make tag'."
            exit 1
          fi

      # No explicit toolchain — uses the channel and the wasm32-unknown-unknown /
      # wasm32-wasip2 targets from rust-toolchain.toml.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        # No cache here, because:
        #   - it's scoped to the tag ref, so it can't be reused across releases;
        #   - the build is ~3 min on a single ubuntu runner;
        #   - fresh release builds are the recommended default.
        with:
          cache: false

      - name: Install ic-wasm
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/dfinity/ic-wasm/releases/download/0.9.11/ic-wasm-installer.sh | sh

      - name: Build release artifacts and recipe
        # `recipe-release` depends on `release`, so one invocation builds every
        # wasm/candid/checksum artifact *and* generates dist/recipe.hbs (pinning
        # this tag's release URLs + the shas just produced).
        run: make recipe-release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The release title is just the version tag (e.g. v0.1.0).
          title="$GITHUB_REF_NAME"

          # The full set `make recipe-release` produced: each release artifact
          # plus its sibling .sha256 (wasm + candid + checksums), and the recipe
          # itself (`recipe.hbs`, no checksum — it pins the wasm shas internally).
          assets=(
            dist/canister-release.wasm.gz dist/canister-release.wasm.gz.sha256
            dist/plugin-release.wasm      dist/plugin-release.wasm.sha256
            dist/certified-assets.did     dist/certified-assets.did.sha256
            dist/recipe.hbs
          )

          # Releases are allowed from any branch. One whose commit is not on main
          # is published as a GitHub pre-release (kept out of "Latest release")
          # with its origin in the title, so it's clearly distinguishable from a
          # main release without being blocked.
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            flag=--latest
          else
            origin=$(git branch -r --contains "$GITHUB_SHA" --format='%(refname:short)' \
                     | grep -vx 'origin/HEAD' | head -n1)
            title="$title — off-main (${origin:-detached HEAD} @ $(git rev-parse --short "$GITHUB_SHA"))"
            flag=--prerelease
          fi

          # Idempotent: a re-run re-uploads the assets instead of failing if the
          # release already exists (e.g. a prior run died after creating it).
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "$title" \
              --generate-notes \
              "$flag"
          fi
